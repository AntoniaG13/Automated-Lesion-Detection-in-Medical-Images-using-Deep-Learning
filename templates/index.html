{% extends "base.html" %}
{% block title %}Lesion Detection Demo{% endblock %}

{% block content %}
  <h1>Automated Lesion Detection — Demo</h1>
  <p class="subtitle">Upload a single CT slice image (PNG/JPG). The model will highlight detected lesion candidates.</p>
  <form action="/predict" method="post" enctype="multipart/form-data">
    <div>
      <input type="file" name="image" accept="image/png, image/jpeg" required>
    </div>
    <button type="submit">Run Detection</button>
  </form>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
{% endblock %}
